name: Refresh README pictures

# Redraws docs/assets from the real source whenever the Dart code, the themes or the roles change,
# so the "Code at a glance" charts, the roles grid and the theme gallery never go stale.
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'tool/readme_assets.py'
      - 'tool/deploy_pictures.py'
      - '.github/workflows/readme-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redraw the pictures
        run: python3 tool/readme_assets.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- docs/assets; then
            echo "Pictures are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets
          git commit -m "Refresh README pictures"
          git pull --rebase origin main
          git push origin HEAD:main
