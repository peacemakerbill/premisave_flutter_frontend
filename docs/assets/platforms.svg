ont-size="13.5" font-weight="700" fill="#0E3B2F">Browser</text></g><text x="24" y="450" font-size="13" fill="#A9C4B8">Google has no map component for Linux, Windows or macOS, so those use OpenStreetMap and Photon. Code flow: the browser returns a code, the backend exchanges it.</text><text x="24" y="472" font-size="13" fill="#E3A72F">* The code is in place, but the platform needs its own app registration and native files, which this repository does not include yet.</text></svg>
