<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d"><title id="t">Architecture of the app</title><desc id="d">A request moves from the screens through state, repositories and the API client to the auth-service, and the response comes back the same way.</desc><defs></defs><style>
text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.node { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity:0; transform: translateY(18px); } to { opacity:1; transform:none; } }
</style><rect width="1200" height="520" rx="22" fill="#0E3B2F"/><text x="24" y="40" font-size="22" font-weight="800" fill="#F6F1E7">How a request travels</text><text x="1176" y="40" text-anchor="end" font-size="13.5" fill="#A9C4B8">amber: request, cream: response</text><text x="24" y="312" font-size="14" font-weight="700" fill="#7DC9AC">Shared pieces every layer leans on</text><text x="24" y="494" font-size="13.5" fill="#A9C4B8">A screen never calls Dio. It reads a provider, the provider calls a repository, the repository calls ApiClient.</text><path d="M128.0 330C128.0 270,122.0 278,122.0 218" fill="none" stroke="#7DC9AC" stroke-opacity=".4" stroke-dasharray="3 6"/><path d="M360.0 330C360.0 270,122.0 278,122.0 218" fill="none" stroke="#7DC9AC" stroke-opacity=".4" stroke-dasharray="3 6"/><path d="M592.0 330C592.0 270,122.0 278,122.0 218" fill="none" stroke="#7DC9AC" stroke-opacity=".4" stroke-dasharray="3 6"/><path d="M824.0 330C824.0 270,836.0 278,836.0 218" fill="none" stroke="#7DC9AC" stroke-opacity=".4" stroke-dasharray="3 6"/><path d="M1056.0 330C1056.0 270,598.0 278,598.0 218" fill="none" stroke="#7DC9AC" stroke-opacity=".4" stroke-dasharray="3 6"/><path id="lk0" d="M220 144.0H262" stroke="#7DC9AC" stroke-width="2" stroke-dasharray="4 6" stroke-opacity=".7"/><path d="M254 138.0L262 144.0L254 150.0" fill="none" stroke="#7DC9AC" stroke-width="2" stroke-opacity=".9"/><path id="lk1" d="M458 144.0H500" stroke="#7DC9AC" stroke-width="2" stroke-dasharray="4 6" stroke-opacity=".7"/><path d="M492 138.0L500 144.0L492 150.0" fill="none" stroke="#7DC9AC" stroke-width="2" stroke-opacity=".9"/><path id="lk2" d="M696 144.0H738" stroke="#7DC9AC" stroke-width="2" stroke-dasharray="4 6" stroke-opacity=".7"/><path d="M730 138.0L738 144.0L730 150.0" fill="none" stroke="#7DC9AC" stroke-width="2" stroke-opacity=".9"/><path id="lk3" d="M934 144.0H976" stroke="#7DC9AC" stroke-width="2" stroke-dasharray="4 6" stroke-opacity=".7"/><path d="M968 138.0L976 144.0L968 150.0" fill="none" stroke="#7DC9AC" stroke-width="2" stroke-opacity=".9"/><path d="M262 178.0H220" stroke="#F6F1E7" stroke-width="1.5" stroke-dasharray="2 7" stroke-opacity=".35"/><path d="M500 178.0H458" stroke="#F6F1E7" stroke-width="1.5" stroke-dasharray="2 7" stroke-opacity=".35"/><path d="M738 178.0H696" stroke="#F6F1E7" stroke-width="1.5" stroke-dasharray="2 7" stroke-opacity=".35"/><path d="M976 178.0H934" stroke="#F6F1E7" stroke-width="1.5" stroke-dasharray="2 7" stroke-opacity=".35"/><g class="node" style="animation-delay:0.00s">
