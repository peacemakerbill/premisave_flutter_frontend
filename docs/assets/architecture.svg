<text x="506" y="366" font-size="17" font-weight="700" fill="#F6F1E7">Theme</text><text x="506" y="386" font-size="12.5" fill="#A9C4B8" class="mono">14 palettes, 11 textures</text><text x="506" y="405" font-size="12.5" fill="#A9C4B8" class="mono">fonts, corners, density</text></g><g class="node" style="animation-delay:1.00s">
<rect x="720" y="330" width="208" height="112" rx="16" fill="#0B2F25" stroke="#7DC9AC" stroke-opacity=".5"/>
<rect x="720" y="346" width="5" height="26" rx="2.5" fill="#7DC9AC"/>
<text x="738" y="366" font-size="17" font-weight="700" fill="#F6F1E7">Token store</text><text x="738" y="386" font-size="12.5" fill="#A9C4B8" class="mono">flutter_secure_storage</text><text x="738" y="405" font-size="12.5" fill="#A9C4B8" class="mono">access, refresh, device</text></g><g class="node" style="animation-delay:1.10s">
