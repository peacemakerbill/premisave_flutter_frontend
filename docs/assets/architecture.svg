<rect x="24" y="86" width="5" height="26" rx="2.5" fill="#E3A72F"/>
<text x="42" y="106" font-size="17" font-weight="700" fill="#F6F1E7">Screens</text><text x="42" y="126" font-size="12.5" fill="#A9C4B8" class="mono">lib/src/features</text><text x="42" y="145" font-size="12.5" fill="#A9C4B8" class="mono">19 feature folders</text><text x="42" y="164" font-size="12.5" fill="#A9C4B8" class="mono">one widget tree</text></g><g class="node" style="animation-delay:0.12s">
<rect x="262" y="70" width="196" height="148" rx="16" fill="#14493B" stroke="#E3A72F" stroke-opacity=".5"/>
