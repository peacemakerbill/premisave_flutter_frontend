<text x="280" y="106" font-size="17" font-weight="700" fill="#F6F1E7">State</text><text x="280" y="126" font-size="12.5" fill="#A9C4B8" class="mono">lib/src/state</text><text x="280" y="145" font-size="12.5" fill="#A9C4B8" class="mono">Riverpod providers</text><text x="280" y="164" font-size="12.5" fill="#A9C4B8" class="mono">session controller</text></g><g class="node" style="animation-delay:0.24s">
<rect x="500" y="70" width="196" height="148" rx="16" fill="#14493B" stroke="#E3A72F" stroke-opacity=".5"/>
