<text x="994" y="106" font-size="17" font-weight="700" fill="#F6F1E7">auth-service</text><text x="994" y="126" font-size="12.5" fill="#A9C4B8" class="mono">Spring Boot</text><text x="994" y="145" font-size="12.5" fill="#A9C4B8" class="mono">REST under /auth,</text><text x="994" y="164" font-size="12.5" fill="#A9C4B8" class="mono">/profile, /places ...</text></g><g class="node" style="animation-delay:0.70s">
