<text x="518" y="106" font-size="17" font-weight="700" fill="#F6F1E7">Repositories</text><text x="518" y="126" font-size="12.5" fill="#A9C4B8" class="mono">lib/src/data</text><text x="518" y="145" font-size="12.5" fill="#A9C4B8" class="mono">8 repositories</text><text x="518" y="164" font-size="12.5" fill="#A9C4B8" class="mono">typed models</text></g><g class="node" style="animation-delay:0.36s">
<rect x="738" y="70" width="196" height="148" rx="16" fill="#14493B" stroke="#E3A72F" stroke-opacity=".5"/>
<rect x="738" y="86" width="5" height="26" rx="2.5" fill="#E3A72F"/>
<text x="756" y="106" font-size="17" font-weight="700" fill="#F6F1E7">ApiClient</text><text x="756" y="126" font-size="12.5" fill="#A9C4B8" class="mono">lib/src/core/network</text><text x="756" y="145" font-size="12.5" fill="#A9C4B8" class="mono">Dio + interceptors</text><text x="756" y="164" font-size="12.5" fill="#A9C4B8" class="mono">refresh on expiry</text></g><g class="node" style="animation-delay:0.48s">
<rect x="976" y="70" width="196" height="148" rx="16" fill="#0E3B2F" stroke="#F6F1E7" stroke-opacity=".5"/>
