<text x="970" y="366" font-size="17" font-weight="700" fill="#F6F1E7">Maps and places</text><text x="970" y="386" font-size="12.5" fill="#A9C4B8" class="mono">Google map or OpenStreetMap</text><text x="970" y="405" font-size="12.5" fill="#A9C4B8" class="mono">suggestions via auth-service</text></g><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" path="M220 144.0H262"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="1.30s" repeatCount="indefinite" path="M220 144.0H262"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="0.45s" repeatCount="indefinite" path="M458 144.0H500"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="1.75s" repeatCount="indefinite" path="M458 144.0H500"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="0.90s" repeatCount="indefinite" path="M696 144.0H738"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="2.20s" repeatCount="indefinite" path="M696 144.0H738"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="1.35s" repeatCount="indefinite" path="M934 144.0H976"/></circle><circle r="5" fill="#E3A72F"><animateMotion dur="2.6s" begin="2.65s" repeatCount="indefinite" path="M934 144.0H976"/></circle><circle r="4" fill="#F6F1E7" opacity=".9"><animateMotion dur="2.6s" begin="2.90s" repeatCount="indefinite" path="M262 178.0H220"/></circle><circle r="4" fill="#F6F1E7" opacity=".9"><animateMotion dur="2.6s" begin="2.50s" repeatCount="indefinite" path="M500 178.0H458"/></circle><circle r="4" fill="#F6F1E7" opacity=".9"><animateMotion dur="2.6s" begin="2.10s" repeatCount="indefinite" path="M738 178.0H696"/></circle><circle r="4" fill="#F6F1E7" opacity=".9"><animateMotion dur="2.6s" begin="1.70s" repeatCount="indefinite" path="M976 178.0H934"/></circle></svg>
