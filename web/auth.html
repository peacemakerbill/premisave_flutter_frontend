<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing you in</title>
  <style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#444}</style>
</head>
<body>
  <p>Finishing sign in. You can close this window if it does not close by itself.</p>
  <script>
    (function () {
      var href = window.location.href;
      var message = { 'flutter-web-auth-2': href };
      if (window.opener) {
        window.opener.postMessage(message, window.location.origin);
        window.close();
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(message, window.location.origin);
      } else if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        // Mobile app: hand the result back through the app's own link scheme.
        window.location.replace('premisave://oauth' + window.location.search);
      } else {
        try { localStorage.setItem('flutter-web-auth-2', href); } catch (e) {}
        window.close();
      }
    })();
  </script>
</body>
</html>
