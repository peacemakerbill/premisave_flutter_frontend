name: premisave_flutter
description: Premisave Real Estate Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.4.3
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.1.2
  google_sign_in: ^6.2.1
  flutter_web_auth_2: ^5.1.0
  flutter_facebook_auth: ^7.0.1
  sign_in_with_apple: ^6.1.1
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.0.0
  cached_network_image: ^3.3.1
  fluttertoast: ^9.0.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage_web: ^1.2.1
  permission_handler: ^12.0.1
  file_picker: ^8.1.2
  geolocator: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: IBMPlexSansCondensed
      fonts:
        - asset: assets/fonts/IBMPlexSansCondensed-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansCondensed-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansCondensed-700.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
        - asset: assets/fonts/DMSans-800.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-400.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-600.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-700.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-700.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-800.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-800.ttf
          weight: 800
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-400.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700
        - asset: assets/fonts/SourceSerif4-800.ttf
          weight: 800
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-400.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-400.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-800.ttf
          weight: 800

# Generates the launcher icons for every platform: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#0E3B2F"
  adaptive_icon_foreground: assets/brand/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/brand/app_icon.png
    background_color: "#0E3B2F"
    theme_color: "#0E3B2F"
